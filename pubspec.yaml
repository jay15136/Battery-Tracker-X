name: battery_tracker
description: Offline-first rechargeable battery inventory and device tracker.
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  camera: ^0.12.1
  camera_windows: ^0.2.6+5
  crypto: ^3.0.6
  desktop_drop: ^0.8.4
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  flutter_svg: ^2.3.0
  image: ^4.5.4
  pdf: ^3.13.0
  printing: ^5.15.0
  zxing2: ^0.2.4
  logging: ^1.3.0
  path_provider: ^2.1.6
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.15.3
  drift_dev: ^2.34.5
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/icons/builtin/
